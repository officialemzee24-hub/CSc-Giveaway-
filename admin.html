<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login — Departmental Giveaway 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="admin.css" />
</head>
<body>

<main class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-mark" aria-hidden="true">CS</span>
      <div>
        <p class="login-dept">Computer Science Department</p>
        <p class="login-title">Admin sign in</p>
      </div>
    </div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <p class="form-message" id="loginMessage" role="alert" aria-live="assertive"></p>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
        <span class="btn-label">Sign in</span>
      </button>
    </form>

    <p class="login-note">Access is restricted to authorized department administrators.</p>
  </div>
</main>

<script type="module" src="admin.js"></script>
</body>
</html>
